<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;750&family=JetBrains+Mono:wght@600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px}
  body{position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#0a1631;background:#eff4fb}
  body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 55%,rgb(89 178 255/.3),transparent 55%)}
  .rail{position:absolute;top:0;bottom:0;width:48px;background:repeating-linear-gradient(135deg,rgb(111 140 186/.25) 0 1px,transparent 1px 9px)}
  .rail.l{left:0;border-right:1px solid #afc3e0}.rail.r{right:0;border-left:1px solid #afc3e0}
  .copy{position:absolute;left:96px;top:96px;width:560px}
  .k{font:600 17px 'JetBrains Mono',monospace;letter-spacing:.08em;color:#22324f;display:flex;align-items:center;gap:14px}
  .k i{width:34px;height:3px;background:#155ef5;display:block}
  h1{margin:26px 0 0;font-size:120px;font-weight:750;letter-spacing:-.06em;line-height:.95}
  p{margin:22px 0 0;font-size:36px;font-weight:650;line-height:1.18;letter-spacing:-.03em}
  p em{font-style:normal;color:#155ef5}
  .badges{position:absolute;left:96px;bottom:84px;display:flex;gap:12px}
  .badges span{padding:9px 16px;border:1.5px solid #afc3e0;border-radius:99px;background:#fff;font:600 18px Inter}
  svg{position:absolute;right:70px;top:150px}
</style></head>
<body>
<div class="rail l"></div><div class="rail r"></div>
<div class="copy">
  <div class="k"><i></i>MAC + ANDROID TABLET · OVER USB-C</div>
  <h1>ExtendPad</h1>
  <p>A USB-C second display for your Mac, <em>using an Android tablet.</em></p>
</div>
<div class="badges"><span>USB-C, no Wi-Fi</span><span>Local only</span><span>macOS 13+</span></div>
<svg width="480" height="330" viewBox="0 0 640 440" fill="none">
  <rect x="24" y="52" width="320" height="206" rx="14" fill="#fff" stroke="#afc3e0" stroke-width="2"/>
  <rect x="34" y="62" width="300" height="186" rx="4" fill="#f3f7ff"/>
  <rect x="34" y="62" width="300" height="12" fill="#e8eef8"/>
  <rect x="58" y="96" width="150" height="104" rx="6" fill="#fff" stroke="#afc3e0"/>
  <rect x="250" y="150" width="84" height="80" rx="6" fill="#fff" stroke="#3d8bff"/>
  <path d="M6 266h356l-18 14H24z" fill="#dde6f3" stroke="#afc3e0" stroke-width="2"/>
  <path d="M344 214c38 0 26 86 82 86s44-36 62-36" stroke="#155ef5" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/>
  <rect x="394" y="112" width="220" height="148" rx="14" fill="#0f1d3a"/>
  <rect x="404" y="122" width="200" height="128" rx="4" fill="#e3edff"/>
  <rect x="404" y="160" width="50" height="80" rx="6" fill="#fff" stroke="#3d8bff"/>
  <rect x="470" y="140" width="116" height="80" rx="6" fill="#fff" stroke="#afc3e0"/>
</svg>
</body></html>
