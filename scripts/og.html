<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@550;700&family=Geist:wght@500;600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px}
  body{position:relative;overflow:hidden;font-family:Geist,sans-serif;color:#f4f6ff;background:#070a1a}
  .b{position:absolute;border-radius:50%;filter:blur(70px)}
  .b1{width:620px;height:620px;left:-160px;top:-260px;background:radial-gradient(circle,#2f5bff,transparent 65%);opacity:.75}
  .b2{width:560px;height:560px;right:-120px;top:-80px;background:radial-gradient(circle,#8b5cf6,transparent 65%);opacity:.7}
  .b3{width:520px;height:520px;left:340px;bottom:-320px;background:radial-gradient(circle,#06b6d4,transparent 65%);opacity:.55}
  .b4{width:320px;height:320px;right:160px;bottom:-60px;background:radial-gradient(circle,#db2777,transparent 65%);opacity:.4}
  .glass{position:absolute;left:70px;top:70px;right:70px;bottom:70px;border-radius:44px;
    background:linear-gradient(155deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
    backdrop-filter:blur(22px) saturate(170%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 0 0 1.5px rgba(255,255,255,.14),0 40px 80px -30px rgba(0,0,0,.7)}
  .eyebrow{position:absolute;left:130px;top:132px;display:flex;align-items:center;gap:12px;padding:9px 18px 9px 14px;border-radius:99px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-size:21px;font-weight:600;color:#dfe4ff}
  .eyebrow i{width:11px;height:11px;border-radius:50%;background:linear-gradient(120deg,#7dd3fc,#a78bfa,#f0abfc);box-shadow:0 0 14px 3px rgba(167,139,250,.8)}
  h1{position:absolute;left:126px;top:196px;margin:0;font-family:Sora;font-size:132px;font-weight:700;letter-spacing:-.06em;line-height:1;
     background:linear-gradient(100deg,#fff 0%,#dbe4ff 35%,#a5c8ff 60%,#c4b5fd 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{position:absolute;left:130px;top:344px;margin:0;width:640px;font-family:Sora;font-size:37px;font-weight:550;letter-spacing:-.03em;line-height:1.2;color:#dfe4ff}
  .chips{position:absolute;left:130px;bottom:108px;display:flex;gap:12px}
  .chips span{padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font-size:20px;font-weight:500;color:#dfe4ff}
  .mark{position:absolute;right:130px;top:150px}
</style></head>
<body>
<div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div>
<div class="glass"></div>
<div class="eyebrow"><i></i>A second display for your Mac</div>
<h1>ExtendPad</h1>
<p>A USB-C second display for your Mac, using an Android tablet.</p>
<div class="chips"><span>USB-C, no Wi-Fi</span><span>Local only</span><span>macOS 13+</span></div>
<svg class="mark" width="200" height="200" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="2" y1="4" x2="30" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient></defs><rect x="2" y="5" width="19" height="14" rx="4" fill="url(#g)" opacity=".9"/><rect x="13" y="12" width="17" height="15" rx="4" fill="rgba(255,255,255,.22)" stroke="url(#g)" stroke-width="1.2"/><path d="M17 17h9M17 21h6" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".85"/></svg>
</body></html>
